<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Quad Pong</title>
<style>
:root {
  --bg1: #1650a8; --bg2: #0c2d72; --bg3: #060f3a;
  --card: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.15);
  --accent: #5b8fff;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  background: radial-gradient(ellipse at 35% 38%, #2068cc 0%, var(--bg2) 48%, var(--bg3) 100%);
  color:#fff;
  font-family: system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

/* ── Floating bubbles background ── */
.bubble { position:fixed; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.18), rgba(255,255,255,0.04));
  animation: drift linear infinite; }
@keyframes drift { 0%{transform:translateY(0) scale(1);opacity:.7}
  50%{transform:translateY(-40px) scale(1.05);opacity:.5}
  100%{transform:translateY(0) scale(1);opacity:.7} }

/* ── Screens ── */
.sc { display:none; flex-direction:column; align-items:center; gap:.9rem;
  width:100%; max-width:440px; padding:1.5rem 1.1rem; }
.sc.on { display:flex; }

/* ── Logo ── */
.logo { display:flex; align-items:center; gap:.6rem; margin-bottom:.3rem; }
.logo h1 { font-size:2rem; font-weight:800; letter-spacing:-1px;
  background: linear-gradient(135deg,#80aaff,#60eacc,#80aaff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.logo-ball { width:44px; height:44px; }

/* ── Cards ── */
.card { background:var(--card); border:1px solid var(--border); border-radius:18px;
  padding:1.1rem; width:100%; backdrop-filter:blur(12px); }
.clabel { font-size:.75rem; opacity:.5; margin-bottom:.6rem; font-weight:600;
  text-transform:uppercase; letter-spacing:.06em; }

/* ── Name input ── */
.name-wrap { width:100%; display:flex; flex-direction:column; gap:.3rem; }
.name-field { background:rgba(255,255,255,.1); border:1.5px solid var(--border);
  border-radius:12px; color:#fff; font-size:1rem; padding:.55rem .9rem 0.55rem 2.6rem;
  width:100%; outline:none; transition:border-color .15s; }
.name-field:focus { border-color:var(--accent); }
.name-field::placeholder { opacity:.3; }
.name-row { position:relative; }
.name-row::before { content:'👤'; position:absolute; left:.75rem; top:50%;
  transform:translateY(-50%); font-size:1.1rem; pointer-events:none; }

/* ── Tabs ── */
.tabs { display:flex; background:rgba(0,0,0,.2); border-radius:14px; padding:3px; width:100%; }
.tab { flex:1; padding:.48rem; border-radius:11px; text-align:center; cursor:pointer;
  font-size:.88rem; transition:all .2s; color:rgba(255,255,255,.5); font-weight:500; }
.tab.on { background:rgba(91,143,255,.35); color:#fff; box-shadow:0 2px 12px rgba(91,143,255,.25); }

/* ── Mode cards ── */
.modes { display:flex; gap:.6rem; }
.modeCard { flex:1; padding:.85rem .5rem; background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.12); border-radius:14px; cursor:pointer;
  text-align:center; color:#fff; transition:all .2s; }
.modeCard:hover,.modeCard.on { border-color:var(--accent); background:rgba(91,143,255,.18);
  box-shadow:0 4px 20px rgba(91,143,255,.2); }
.modeCard canvas { border-radius:50%; margin-bottom:.4rem; }
.modeCard .mtitle { font-size:.88rem; font-weight:600; display:block; }
.modeCard .msub { font-size:.7rem; opacity:.45; display:block; margin-top:.15rem; }

/* ── Difficulty ── */
.diffs { display:flex; gap:.5rem; margin-top:.6rem; }
.diffBtn { flex:1; padding:.45rem; border-radius:10px; border:1.5px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05); cursor:pointer; font-size:.82rem;
  color:rgba(255,255,255,.45); text-align:center; transition:all .2s; font-weight:500; }
.diffBtn:hover,.diffBtn.on { color:#fff; }
#dn.on { border-color:#60eacc; background:rgba(96,234,204,.15); color:#60eacc; }
#dh.on { border-color:#ff7b54; background:rgba(255,123,84,.15); color:#ff7b54; }

/* ── Buttons ── */
.code-in { background:rgba(255,255,255,.1); border:1.5px solid var(--border);
  border-radius:12px; color:#fff; font-size:1.5rem; padding:.5rem .75rem;
  width:100%; text-align:center; letter-spacing:.28em; text-transform:uppercase; outline:none; }
.code-in:focus { border-color:var(--accent); }
.code-in::placeholder { opacity:.2; letter-spacing:.1em; }

.btn { background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.18);
  color:#fff; padding:.65rem 1.5rem; border-radius:12px; font-size:.92rem;
  cursor:pointer; width:100%; transition:all .2s; font-weight:500; }
.btn:hover { background:rgba(255,255,255,.16); }
.btn.pri { background:linear-gradient(135deg,#4a7af8,#5b8fff); border-color:#6690ff; }
.btn.pri:hover { background:linear-gradient(135deg,#3568f5,#4a7af8); box-shadow:0 4px 20px rgba(91,143,255,.4); }

.or { display:flex; align-items:center; gap:.6rem; width:100%;
  color:rgba(255,255,255,.2); font-size:.78rem; }
.or::before,.or::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.1); }

/* ── Waiting ── */
.roomCode { font-size:3rem; font-weight:800; letter-spacing:.32em; color:var(--accent);
  text-align:center; text-shadow:0 0 30px rgba(91,143,255,.5); }
.slots { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; width:100%; }
.slot { padding:.55rem; border-radius:10px; border:1.5px solid rgba(255,255,255,.1);
  font-size:.82rem; text-align:center; opacity:.35; transition:all .25s; }
.slot.filled { opacity:1; }

/* ── Countdown ── */
.cdNum { font-size:7.5rem; font-weight:800; text-align:center; line-height:1;
  background:linear-gradient(135deg,#80aaff,#60eacc);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

/* ── Game ── */
#gw { position:fixed; inset:0; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:4px;
  background: radial-gradient(ellipse at 35% 38%, #2068cc 0%, #0c2d72 48%, #060f3a 100%); }
#gw.on { display:flex; }
#c { display:block; border-radius:14px; box-shadow:0 8px 40px rgba(0,0,30,.6);
  touch-action:none; cursor:none;
  max-width:calc(100dvw - 10px); max-height:calc(100dvh - 46px); }
#hint { font-size:.65rem; opacity:.28; text-align:center; padding:0 8px; }

/* ── Game over ── */
.goRows { display:flex; flex-direction:column; gap:.32rem; width:100%; }
.goRow { display:flex; justify-content:space-between; align-items:center;
  padding:.38rem 0; border-bottom:1px solid rgba(255,255,255,.07); font-size:.9rem; }
.winTag { font-size:1.1rem; font-weight:700; padding:.5rem 1.4rem;
  border-radius:12px; text-align:center; }
.err { color:#ff8080; font-size:.8rem; text-align:center; min-height:1em; }
</style>
</head>
<body>

<!-- Decorative bubbles -->
<div class="bubble" style="width:180px;height:180px;left:8%;top:12%;animation-duration:8s;opacity:.4"></div>
<div class="bubble" style="width:100px;height:100px;right:10%;top:55%;animation-duration:11s;opacity:.3"></div>
<div class="bubble" style="width:60px;height:60px;left:20%;bottom:15%;animation-duration:7s;opacity:.25"></div>
<div class="bubble" style="width:250px;height:250px;right:-5%;bottom:-8%;animation-duration:13s;opacity:.2"></div>

<!-- ─── LOBBY ─── -->
<div class="sc on" id="s-lobby">
  <div class="logo">
    <canvas class="logo-ball" id="logo-c" width="44" height="44"></canvas>
    <h1>Quad Pong</h1>
  </div>

  <div class="name-wrap">
    <div class="name-row">
      <input class="name-field" id="pname" placeholder="Введи своё имя…" maxlength="16">
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" id="t-solo"  onclick="switchTab('solo')">🎮 Один игрок</div>
    <div class="tab"    id="t-multi" onclick="switchTab('multi')">🌐 Онлайн</div>
  </div>

  <!-- Solo -->
  <div id="p-solo" style="width:100%;display:flex;flex-direction:column;gap:.75rem">
    <div class="card">
      <div class="clabel">Режим: ты против трёх AI</div>
      <div style="display:flex;justify-content:center;margin-bottom:.7rem">
        <canvas id="solo-preview" width="120" height="60" style="border-radius:12px"></canvas>
      </div>
      <div class="clabel">Сложность</div>
      <div class="diffs">
        <div class="diffBtn on" id="dn" onclick="setDiff('normal',this)">😌 Нормальная</div>
        <div class="diffBtn"    id="dh" onclick="setDiff('hard',this)">😤 Сложная</div>
      </div>
    </div>
    <button class="btn pri" onclick="startSolo()">🚀 Играть против AI</button>
  </div>

  <!-- Multi -->
  <div id="p-multi" style="width:100%;display:none;flex-direction:column;gap:.75rem">
    <div class="card">
      <div class="clabel">Создать комнату</div>
      <div class="modes">
        <div class="modeCard on" id="mp2" onclick="setMp(2,this)">
          <canvas width="50" height="50" id="mc2"></canvas>
          <span class="mtitle">2 игрока</span><span class="msub">Лево / Право</span>
        </div>
        <div class="modeCard" id="mp4" onclick="setMp(4,this)">
          <canvas width="50" height="50" id="mc4"></canvas>
          <span class="mtitle">4 игрока</span><span class="msub">Все стороны</span>
        </div>
      </div>
      <button class="btn pri" style="margin-top:.75rem" onclick="createRoom()">🎮 Создать комнату</button>
    </div>
    <div class="or">или</div>
    <div class="card">
      <div class="clabel">Войти по коду</div>
      <input class="code-in" id="code-in" placeholder="XXXX" maxlength="4"
             oninput="this.value=this.value.toUpperCase()">
      <button class="btn" style="margin-top:.65rem" onclick="joinRoom()">🚪 Войти</button>
    </div>
  </div>
  <div class="err" id="lerr"></div>
</div>

<!-- ─── WAITING ─── -->
<div class="sc" id="s-wait">
  <div class="logo"><canvas class="logo-ball" width="44" height="44" id="wait-ball"></canvas><h1>Quad Pong</h1></div>
  <p style="opacity:.4;font-size:.88rem">Код комнаты — отправь друзьям</p>
  <div class="roomCode" id="show-code">----</div>
  <div class="card">
    <div class="clabel">Игроки</div>
    <div class="slots" id="slots"></div>
  </div>
  <p style="font-size:.76rem;opacity:.32;text-align:center">Игра начнётся автоматически</p>
  <div style="font-size:.7rem;opacity:.25;background:rgba(255,255,255,.04);padding:.4rem 1rem;
    border-radius:10px;width:100%;text-align:center" id="yhint"></div>
</div>

<!-- ─── COUNTDOWN ─── -->
<div class="sc" id="s-cd">
  <p style="opacity:.4;font-size:.9rem">Приготовьтесь!</p>
  <div class="cdNum" id="cdn">3</div>
</div>

<!-- ─── GAME ─── -->
<div id="gw">
  <canvas id="c"></canvas>
  <div id="hint"></div>
</div>

<!-- ─── GAMEOVER ─── -->
<div class="sc" id="s-go">
  <div class="logo"><canvas class="logo-ball" width="44" height="44" id="go-ball"></canvas><h1>Игра окончена</h1></div>
  <div class="winTag" id="win-tag"></div>
  <div class="card" style="width:100%">
    <div class="clabel">Итоговые очки</div>
    <div class="goRows" id="go-rows"></div>
  </div>
  <button class="btn pri" onclick="location.reload()">🔄 Играть снова</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ─── Game constants (mirror server) ──────────────────────────────
const GW=800,GH=800,WALL=14,PAD_W=14,PAD_LEN=180,BALL_R=12;
const APPLE_R=17,BIG_FACTOR=1.5;

const PCOL={left:'#7c6be8',right:'#f08c6e',top:'#52c9a0',bottom:'#e87db5'};
const PNAME={left:'Левый',right:'Правый',top:'Верхний',bottom:'Нижний'};
const PCTRL={left:'Мышь/W·S',right:'Мышь/↑↓',top:'Мышь/A·D',bottom:'Мышь/←→'};
const SIDES=['left','right','top','bottom'];

// ─── State ───────────────────────────────────────────────────────
let socket, myMode=4, myDiff='normal', mySide, gs=null;
let canvas, ctx, S, VW, iSc; // canvas size, visual wall px, inner scale
let mouseX=GW/2, mouseY=GH/2, keys={};
let localPos=GW/2-PAD_LEN/2, localVel=0;
let animId, sendTimer, lastFrame=0, trail=[];
const ACCEL=2800, DECEL=4000, BASE_SPD=300, SPD_PER_SC=9, MAX_EXTRA=220;

// ─── Coordinate helpers ───────────────────────────────────────────
// Inner scale maps [0,GW] → [VW, S-VW], with physics wall handled visually
function gx(x){ return VW + x * iSc; }
function gy(y){ return VW + y * iSc; }
function gl(l){ return l * iSc; }

// ─── Cached background (recreated on resize only) ─────────────────
let bgCache = null;
function buildBgCache() {
  bgCache = document.createElement('canvas');
  bgCache.width = bgCache.height = S;
  const c = bgCache.getContext('2d');
  // Outer bg
  const bg = c.createRadialGradient(S*.4,S*.35,0,S*.5,S*.5,S*.75);
  bg.addColorStop(0,'#1c5dc0'); bg.addColorStop(.5,'#0e3590'); bg.addColorStop(1,'#060f3a');
  c.fillStyle = bg;
  c.fillRect(0,0,S,S);
  // Inner field tint
  c.fillStyle = 'rgba(20,70,180,.15)';
  c.fillRect(VW,VW,S-2*VW,S-2*VW);
  // Grid (drawn once)
  c.strokeStyle='rgba(255,255,255,.055)'; c.lineWidth=1;
  const iw=S-2*VW;
  for(let i=1;i<6;i++){
    const x=VW+iw/6*i, y=VW+iw/6*i;
    c.beginPath();c.moveTo(x,VW);c.lineTo(x,S-VW);c.stroke();
    c.beginPath();c.moveTo(VW,y);c.lineTo(S-VW,y);c.stroke();
  }
  c.strokeStyle='rgba(255,255,255,.1)'; c.lineWidth=1; c.setLineDash([4,8]);
  c.beginPath();c.moveTo(S/2,VW);c.lineTo(S/2,S-VW);c.stroke();
  c.beginPath();c.moveTo(VW,S/2);c.lineTo(S-VW,S/2);c.stroke();
  c.setLineDash([]);
}

// ─── Fast ball draw (NO shadowBlur, NO gradient per frame) ────────
function cartoonBall(cx,cy,r,col,nx,ny,state,isIcon){
  const fR = Math.max(r, isIcon ? 9 : 7);
  // Drop shadow – simple dark circle, cheaper than ellipse
  ctx.fillStyle='rgba(0,0,20,.22)';
  ctx.beginPath(); ctx.arc(cx+fR*.08,cy+fR*.75,fR*.65,0,Math.PI*2); ctx.fill();
  // Body – solid base color, lighter highlight on top-left quadrant
  const baseCol = state==='frozen'?'#88ccff': state==='fire'?'#ff8800': col||'#f0f0f2';
  ctx.fillStyle = baseCol;
  ctx.beginPath(); ctx.arc(cx,cy,fR,0,Math.PI*2); ctx.fill();
  // Top-left highlight (replaces radial gradient)
  ctx.fillStyle='rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.arc(cx-fR*.25,cy-fR*.25,fR*.38,0,Math.PI*2); ctx.fill();
  if(fR<6) return;
  // Eyes
  const eR=Math.max(fR*.19,1.2), ed=fR*.28;
  const lx2=nx*fR*.1, ly2=ny*fR*.1;
  ctx.fillStyle='#1a1040';
  ctx.beginPath(); ctx.arc(cx-ed+lx2,cy-fR*.09+ly2,eR,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+ed+lx2,cy-fR*.09+ly2,eR,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(cx-ed+lx2+eR*.28,cy-fR*.09+ly2-eR*.3,eR*.38,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+ed+lx2+eR*.28,cy-fR*.09+ly2-eR*.3,eR*.38,0,Math.PI*2); ctx.fill();
  if(fR<9) return;
  // Mouth only (skip brows for icons to save ops)
  ctx.strokeStyle='#1a1040'; ctx.lineWidth=Math.max(eR*.6,0.8); ctx.lineCap='round';
  const mx=cx+lx2*.5, mbase=cy+fR*.18+ly2*.5;
  if(state==='frozen'){
    ctx.beginPath(); ctx.arc(mx,mbase,eR*.7,0,Math.PI*2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(mx,mbase-eR*.25,eR*1.1,.1*Math.PI,.9*Math.PI); ctx.stroke();
  }
}

// ─── Color helpers ────────────────────────────────────────────────
function lighten(hex,a){const n=parseInt(hex.replace('#',''),16);const r=Math.min(255,((n>>16)&0xff)+a),g=Math.min(255,((n>>8)&0xff)+a),b=Math.min(255,(n&0xff)+a);return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
function darken(hex,a){const n=parseInt(hex.replace('#',''),16);const r=Math.max(0,((n>>16)&0xff)-a),g=Math.max(0,((n>>8)&0xff)-a),b=Math.max(0,(n&0xff)-a);return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}

// ─── Lobby previews (stop when game starts) ──────────────────────
let lobbyAnimOn = true;
function drawLobbyPreviews(){
  if(!lobbyAnimOn) return;
  ['logo-c','wait-ball','go-ball'].forEach(id=>{
    const el=document.getElementById(id); if(!el)return;
    const c=el.getContext('2d'),r=el.width/2;
    c.clearRect(0,0,el.width,el.height);
    const t=performance.now()/2000;
    const saved=ctx; ctx=c;
    cartoonBall(r,r,r*.88,'#5b8fff',Math.cos(t),Math.sin(t)*.3,'normal',false);
    ctx=saved;
  });
  const sp=document.getElementById('solo-preview');
  if(sp){
    const c=sp.getContext('2d'); c.clearRect(0,0,sp.width,sp.height);
    const saved=ctx; ctx=c;
    cartoonBall(20,30,13,Object.values(PCOL)[0],1,.1,'normal',true);
    Object.values(PCOL).slice(1).forEach((col,i)=>{
      cartoonBall(62+i*20,30,8,col,-1,.1,'normal',true);
    });
    ctx=saved;
  }
  [['mc2',2],['mc4',4]].forEach(([id,mode])=>{
    const el=document.getElementById(id); if(!el)return;
    const c=el.getContext('2d'); c.clearRect(0,0,50,50);
    const saved=ctx; ctx=c;
    const pts=mode===2?[[13,25],[37,25]]:[[13,25],[37,25],[25,13],[25,37]];
    const cols2=Object.values(PCOL);
    pts.forEach(([x,y],i)=>cartoonBall(x,y,8,cols2[i],i<2?(i===0?1:-1):0,i<2?0:(i===2?-1:1),'normal',true));
    ctx=saved;
  });
  requestAnimationFrame(drawLobbyPreviews);
}
function show(id){
  document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));
  document.getElementById('gw').classList.remove('on');
  document.getElementById(id).classList.add('on');
}
function switchTab(t){
  document.getElementById('t-solo').classList.toggle('on',t==='solo');
  document.getElementById('t-multi').classList.toggle('on',t==='multi');
  document.getElementById('p-solo').style.display=t==='solo'?'flex':'none';
  document.getElementById('p-multi').style.display=t==='multi'?'flex':'none';
}
function setDiff(d,el){myDiff=d;document.querySelectorAll('.diffBtn').forEach(b=>b.classList.remove('on'));el.classList.add('on');}
let mpMode=2;
function setMp(m,el){mpMode=m;document.querySelectorAll('.modeCard').forEach(b=>b.classList.remove('on'));el.classList.add('on');}
function pname(){return document.getElementById('pname').value.trim().slice(0,16)||'Игрок';}

// ─── Draw preview canvases in lobby ──────────────────────────────
function drawLobbyPreviews(){
  // Logo balls
  ['logo-c','wait-ball','go-ball'].forEach(id=>{
    const el=document.getElementById(id); if(!el)return;
    const c=el.getContext('2d'),r=el.width/2;
    c.clearRect(0,0,el.width,el.height);
    const t=performance.now()/2000;
    const nx=Math.cos(t),ny=Math.sin(t)*.3;
    const saved=ctx; ctx=c; cartoonBall(r,r,r*.88,'#6090ff',nx,ny,'normal',false); ctx=saved;
  });
  // Solo preview
  const sp=document.getElementById('solo-preview');
  if(sp){
    const c=sp.getContext('2d');
    c.clearRect(0,0,sp.width,sp.height);
    const cols=['#7c6be8','#f08c6e','#52c9a0','#e87db5'];
    const saved=ctx; ctx=c;
    const t=performance.now()/1500;
    cartoonBall(20,30,14,cols[0],1,.1,'normal',true);
    [cols[1],cols[2],cols[3]].forEach((col,i)=>{
      cartoonBall(62+i*20,30,9,col,-1,.1,'normal',true);
    });
    ctx=saved;
  }
  // Mode card canvases
  [['mc2',2],['mc4',4]].forEach(([id,mode])=>{
    const el=document.getElementById(id); if(!el)return;
    const c=el.getContext('2d'); c.clearRect(0,0,50,50);
    const saved=ctx; ctx=c;
    const pts=mode===2?[[13,25],[37,25]]:[[13,25],[37,25],[25,13],[25,37]];
    const cols2=Object.values(PCOL);
    pts.forEach(([x,y],i)=>cartoonBall(x,y,9,cols2[i],i<2?(i===0?1:-1):0,i<2?0:(i===2?-1:1),'normal',true));
    ctx=saved;
  });
  requestAnimationFrame(drawLobbyPreviews);
}

// ─── Socket ──────────────────────────────────────────────────────
socket=io({reconnection:true,reconnectionDelay:800,reconnectionAttempts:10,timeout:20000});

socket.on('connect',()=>document.getElementById('lerr').textContent='');
socket.on('connect_error',()=>document.getElementById('lerr').textContent='⚠️ Нет связи, переподключаемся…');

socket.on('joined',({roomId,side,solo})=>{
  mySide=side; myMode=4; // always 4 in solo; overridden by lobby for multi
  if(!solo){
    document.getElementById('show-code').textContent=roomId;
    document.getElementById('yhint').textContent=`Вы — ${PNAME[side]}  |  ${PCTRL[side]}`;
    show('s-wait');
  }
});

socket.on('lobby',({players,mode,names})=>{
  myMode=mode;
  const all=mode===2?['left','right']:SIDES;
  document.getElementById('slots').innerHTML=all.map(s=>{
    const ok=players.includes(s);
    const nm=(names&&names[s])||PNAME[s];
    return `<div class="slot ${ok?'filled':''}" style="border-color:${ok?PCOL[s]+'77':'rgba(255,255,255,.1)'};color:${ok?PCOL[s]:'rgba(255,255,255,.25)'}">
      ${ok?'✅':'⏳'} ${nm}${s===mySide?' (вы)':''}</div>`;
  }).join('');
});

socket.on('countdown',()=>{
  // Pre-init canvas so field is visible during countdown
  setupCanvas();
  document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));
  document.getElementById('gw').classList.add('on');
  document.getElementById('hint').textContent=`${pname()} · ${PNAME[mySide]}  |  ${PCTRL[mySide]}`;
  const isV=mySide==='left'||mySide==='right';
  localPos=(isV?GH:GW)/2-PAD_LEN/2; localVel=0;
  let n=3, cdAnimId;
  const cdLoop=()=>{ drawCountdownFrame(n); cdAnimId=requestAnimationFrame(cdLoop); };
  cdAnimId=requestAnimationFrame(cdLoop);
  const t=setInterval(()=>{
    n--;
    if(n<=0){ clearInterval(t); cancelAnimationFrame(cdAnimId); initGame(); }
  },1000);
});

socket.on('state',s=>{gs=s;});

socket.on('gameover',({winner,scores,names})=>{
  cancelAnimationFrame(animId); clearInterval(sendTimer);
  const wt=document.getElementById('win-tag');
  const wn=winner?((names&&names[winner])||PNAME[winner]):null;
  if(winner){wt.textContent=`🏆 ${wn} победил!`;wt.style.background=PCOL[winner]+'33';wt.style.color=PCOL[winner];}
  else{wt.textContent='🤝 Ничья!';wt.style.color='#fff';}
  const all=myMode===2?['left','right']:SIDES;
  document.getElementById('go-rows').innerHTML=all.map(s=>{
    const nm=(names&&names[s])||PNAME[s];
    return `<div class="goRow"><span style="color:${PCOL[s]};font-weight:600">${nm}</span><span>${scores[s]||0} ⭐</span></div>`;
  }).join('');
  show('s-go');
});

socket.on('playerLeft',()=>{cancelAnimationFrame(animId);clearInterval(sendTimer);alert('Игрок отключился.');location.reload();});
socket.on('err',m=>{document.getElementById('lerr').textContent=m;});

// ─── Actions ─────────────────────────────────────────────────────
function startSolo(){socket.emit('solo',{difficulty:myDiff,name:pname()});}
function createRoom(){myMode=mpMode;socket.emit('create',{mode:mpMode,name:pname()});}
function joinRoom(){
  const c=document.getElementById('code-in').value.trim();
  if(c.length!==4){document.getElementById('lerr').textContent='Нужен 4-символьный код';return;}
  socket.emit('join',{roomId:c,name:pname()});
}

// ─── Canvas setup (called once, may be before game start) ────────
let canvasReady=false;
function setupCanvas(){
  if(canvasReady)return;
  canvasReady=true;
  lobbyAnimOn=false; // stop lobby animation loop
  canvas=document.getElementById('c'); ctx=canvas.getContext('2d');
  HAS_RR = !!ctx.roundRect;
  resize(); window.addEventListener('resize',resize);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',resize);
  canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect();
    mouseX=(e.clientX-r.left-VW)/iSc; mouseY=(e.clientY-r.top-VW)/iSc;
  });
  const onT=e=>{
    e.preventDefault();
    const r=canvas.getBoundingClientRect(),t=e.touches[0];
    mouseX=(t.clientX-r.left-VW)/iSc; mouseY=(t.clientY-r.top-VW)/iSc;
  };
  canvas.addEventListener('touchstart',onT,{passive:false});
  canvas.addEventListener('touchmove', onT,{passive:false});
  window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
  window.addEventListener('keyup',e=>keys[e.key]=false);
}

// ─── Game init (starts actual gameplay loop) ──────────────────────
function initGame(){
  setupCanvas();
  const isV=mySide==='left'||mySide==='right';
  localPos=(isV?GH:GW)/2-PAD_LEN/2; localVel=0;
  sendTimer=setInterval(sendPos,1000/60);
  lastFrame=performance.now();
  animId=requestAnimationFrame(loop);
}

// ─── Countdown field preview ──────────────────────────────────────
function drawCountdownFrame(n){
  if(!ctx)return;
  const all=myMode===2?['left','right']:SIDES;
  // Background
  const bg=ctx.createRadialGradient(S*.4,S*.35,0,S*.5,S*.5,S*.75);
  bg.addColorStop(0,'#2068cc');bg.addColorStop(.5,'#1240a0');bg.addColorStop(1,'#070f3a');
  ctx.fillStyle=bg;
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(0,0,S,S,14);ctx.fill();}else ctx.fillRect(0,0,S,S);
  // Court inner
  const ix=VW,iy=VW,iw=S-2*VW,ih=S-2*VW;
  ctx.fillStyle='rgba(40,100,200,.12)'; ctx.fillRect(ix,iy,iw,ih);
  // Dashed grid
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=.8;
  for(let i=1;i<6;i++){
    const x=ix+iw/6*i,y=iy+ih/6*i;
    ctx.beginPath();ctx.moveTo(x,iy);ctx.lineTo(x,iy+ih);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ix,y);ctx.lineTo(ix+iw,y);ctx.stroke();
  }
  // Center cross dashed
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.setLineDash([4,8]);
  ctx.beginPath();ctx.moveTo(S/2,iy);ctx.lineTo(S/2,iy+ih);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ix,S/2);ctx.lineTo(ix+iw,S/2);ctx.stroke();
  ctx.setLineDash([]);

  // Wall strips + paddles at start positions
  all.forEach(s=>{
    const col=PCOL[s],isMe=s===mySide;
    // Wall strip
    let wGr;
    if(s==='left'){wGr=ctx.createLinearGradient(0,0,VW,0);}
    else if(s==='right'){wGr=ctx.createLinearGradient(S,0,S-VW,0);}
    else if(s==='top'){wGr=ctx.createLinearGradient(0,0,0,VW);}
    else{wGr=ctx.createLinearGradient(0,S,0,S-VW);}
    wGr.addColorStop(0,isMe?col+'80':col+'40');wGr.addColorStop(1,'transparent');
    ctx.fillStyle=wGr;
    if(s==='left')  ctx.fillRect(0,0,VW,S);
    if(s==='right') ctx.fillRect(S-VW,0,VW,S);
    if(s==='top')   ctx.fillRect(0,0,S,VW);
    if(s==='bottom')ctx.fillRect(0,S-VW,S,VW);
    // Paddle at default center position
    const isV2=s==='left'||s==='right';
    const defPos=((isV2?GH:GW)/2-PAD_LEN/2);
    const dp=s===mySide?localPos:defPos;
    const pw=gl(PAD_W),pl=gl(PAD_LEN);
    let rx,ry,rw,rh;
    if(s==='left')  {rx=gx(WALL);         ry=gy(dp);rw=pw;rh=pl;}
    if(s==='right') {rx=gx(GW-WALL-PAD_W);ry=gy(dp);rw=pw;rh=pl;}
    if(s==='top')   {rx=gx(dp);ry=gy(WALL);rw=pl;rh=pw;}
    if(s==='bottom'){rx=gx(dp);ry=gy(GH-WALL-PAD_W);rw=pl;rh=pw;}
    ctx.fillStyle=isMe?col:col+'99';
    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,3*iSc);ctx.fill();}else ctx.fillRect(rx,ry,rw,rh);
    if(isMe){ ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;if(ctx.roundRect){ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,3*iSc);ctx.stroke();}else ctx.strokeRect(rx,ry,rw,rh); }
    // "ВЫ" label on player's paddle
    if(isMe){
      ctx.fillStyle='rgba(255,255,255,.9)'; ctx.textAlign='center';
      ctx.font=`bold ${Math.max(gl(11),7)}px system-ui`;
      if(isV2) ctx.fillText('ВЫ →',rx+pw/2+(isMe&&s==='right'?-gl(28):gl(28)),ry+pl/2+gl(4));
      else     ctx.fillText('ВЫ',rx+pl/2,ry+pw/2+(s==='top'?gl(24):-gl(16)));
    }
    // Character icon
    const iconR=VW*.42;
    let icx,icy;
    if(s==='left')  {icx=VW*.5;icy=S/2;}
    if(s==='right') {icx=S-VW*.5;icy=S/2;}
    if(s==='top')   {icx=S/2;icy=VW*.5;}
    if(s==='bottom'){icx=S/2;icy=S-VW*.5;}
    cartoonBall(icx,icy,iconR,col,s==='left'?1:s==='right'?-1:0,s==='top'?1:s==='bottom'?-1:0,'normal',true);
  });

  // Semi-dark overlay
  ctx.fillStyle='rgba(0,0,18,.52)'; ctx.fillRect(0,0,S,S);

  // Big countdown number with gradient
  ctx.textAlign='center';
  ctx.font=`900 ${S*.18}px system-ui`;
  const cdg=ctx.createLinearGradient(S/2,S/2-S*.1,S/2,S/2+S*.1);
  cdg.addColorStop(0,'#a0c8ff'); cdg.addColorStop(1,'#60eacc');
  ctx.fillStyle=cdg;
  ctx.fillText(n,S/2,S/2+S*.07);

  // Sub-text
  ctx.font=`500 ${Math.max(S*.03,11)}px system-ui`;
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillText('Найди свою доску на поле',S/2,S/2+S*.17);

  // Pulsing arrow pointing to player's side
  const pulse=.7+.3*Math.sin(performance.now()/250);
  ctx.fillStyle=`rgba(${parseInt(PCOL[mySide].slice(1,3),16)},${parseInt(PCOL[mySide].slice(3,5),16)},${parseInt(PCOL[mySide].slice(5,7),16)},${pulse})`;
  ctx.font=`${Math.max(S*.045,14)}px system-ui`;
  const arrowOffset=S*.06;
  if(mySide==='left')  ctx.fillText('◀',VW+arrowOffset,S/2+S*.015);
  if(mySide==='right') ctx.fillText('▶',S-VW-arrowOffset,S/2+S*.015);
  if(mySide==='top')   ctx.fillText('▲',S/2,VW+arrowOffset);
  if(mySide==='bottom')ctx.fillText('▼',S/2,S-VW-arrowOffset);
}

function resize(){
  // Use visualViewport for accurate mobile height (excludes browser chrome)
  const vp = window.visualViewport || {width: window.innerWidth, height: window.innerHeight};
  const vw = vp.width, vh = vp.height;
  let sz;
  if(vw < 500){
    // Phone: square canvas that fits both dimensions, leave room for hint
    sz = Math.min(vw - 8, vh - 44);
  } else if(vw < 900){
    // Tablet: slightly smaller
    sz = Math.min(vw * 0.82, vh - 44, 460);
  } else {
    // Desktop: compact field
    sz = Math.min(vw * 0.58, vh - 60, 490);
  }
  S = Math.round(Math.max(sz, 260));
  canvas.width = canvas.height = S;
  VW = Math.max(Math.round(S * 0.055), 24);
  iSc = (S - 2*VW) / GW;
  buildBgCache(); // rebuild cached background on every resize
}

// ─── Paddle control ───────────────────────────────────────────────
function updatePaddle(dt){
  const isV=mySide==='left'||mySide==='right';
  const sc=gs?.scores?.[mySide]||0, eLen=(gs?.powerups?.[mySide]?.type==='big')?PAD_LEN*BIG_FACTOR:PAD_LEN;
  const spd=Math.min(BASE_SPD+sc*SPD_PER_SC,BASE_SPD+MAX_EXTRA);
  const lim=(isV?GH:GW)-WALL-PAD_W-eLen;
  let dir=0;
  if(isV){if(mySide==='left'){if(keys['w']||keys['W'])dir=-1;if(keys['s']||keys['S'])dir=1;}else{if(keys['ArrowUp'])dir=-1;if(keys['ArrowDown'])dir=1;}}
  else{if(mySide==='top'){if(keys['a']||keys['A'])dir=-1;if(keys['d']||keys['D'])dir=1;}else{if(keys['ArrowLeft'])dir=-1;if(keys['ArrowRight'])dir=1;}}
  if(dir!==0){localVel=Math.sign(dir)*Math.min(Math.abs(localVel)+ACCEL*dt,spd);}
  else{const dec=DECEL*dt;localVel=Math.abs(localVel)<dec?0:localVel-Math.sign(localVel)*dec;}
  if(localVel!==0){localPos=Math.max(WALL+PAD_W,Math.min(lim,localPos+localVel*dt));}
  else{const mt=isV?mouseY-eLen/2:mouseX-eLen/2;localPos=Math.max(WALL+PAD_W,Math.min(lim,mt));}
}

let lastSent=null;
function sendPos(){if(!gs)return;const p=Math.round(localPos);if(p!==lastSent){socket.emit('move',{pos:p});lastSent=p;}}

function loop(now){
  const dt=Math.min((now-lastFrame)/1000,.05); lastFrame=now;
  updatePaddle(dt); draw();
  animId=requestAnimationFrame(loop);
}

// ─── Draw ─────────────────────────────────────────────────────────
// Cached HAS_RR flag (set once in setupCanvas)
let HAS_RR = false;

function draw(){
  if(!ctx)return;
  // Blit cached background — no gradient creation per frame
  if(bgCache) ctx.drawImage(bgCache,0,0); else ctx.clearRect(0,0,S,S);

  if(!gs){
    ctx.fillStyle='rgba(255,255,255,.3)'; ctx.font=`${Math.max(13*iSc,11)}px system-ui`;
    ctx.textAlign='center'; ctx.fillText('Ожидание…',S/2,S/2); return;
  }

  const{ball,paddles,apples,powerups,scores,lives,names}=gs;
  const all=myMode===2?['left','right']:SIDES;

  // ── Wall strips: solid fill, no gradient ─────────────────────
  all.forEach(s=>{
    const alive=paddles[s]?.alive;
    ctx.fillStyle=alive?PCOL[s]+'40':'rgba(200,50,50,.18)';
    if(s==='left')  ctx.fillRect(0,0,VW,S);
    if(s==='right') ctx.fillRect(S-VW,0,VW,S);
    if(s==='top')   ctx.fillRect(0,0,S,VW);
    if(s==='bottom')ctx.fillRect(0,S-VW,S,VW);
  });

  // ── Player icons + name + lives + score ──────────────────────
  all.forEach(s=>{
    const alive=paddles[s]?.alive;
    const col=PCOL[s];
    const lv=Math.max(0,Math.min(5,lives[s]||0));
    const iconR=VW*.4;
    let icx,icy;
    if(s==='left')  {icx=VW*.5;    icy=S/2;}
    if(s==='right') {icx=S-VW*.5;  icy=S/2;}
    if(s==='top')   {icx=S/2;      icy=VW*.5;}
    if(s==='bottom'){icx=S/2;      icy=S-VW*.5;}
    cartoonBall(icx,icy,iconR,alive?col:'#555566',
      s==='left'?1:s==='right'?-1:0,
      s==='top' ?1:s==='bottom'?-1:0,'normal',true);

    ctx.save();
    const fs=Math.max(VW*.21,7.5);
    const liveStr=lv===0?'💀':'❤️'.repeat(lv);
    const nm=(names&&names[s])||PNAME[s];
    if(s==='left')  {ctx.translate(VW*.5,S/2);ctx.rotate(-Math.PI/2);}
    else if(s==='right'){ctx.translate(S-VW*.5,S/2);ctx.rotate(Math.PI/2);}
    else if(s==='top')  {ctx.translate(S/2,VW*.5);}
    else                {ctx.translate(S/2,S-VW*.5);}
    ctx.font=`600 ${fs}px system-ui`;
    const textW=ctx.measureText(nm).width;
    const br2=Math.max(fs*.38,3.5), gap2=fs*.25;
    const totW=br2*2+gap2+textW, sx0=-totW/2;
    const lY=iconR+fs;
    // Colored dot + white name
    ctx.fillStyle=alive?col:'rgba(160,80,80,.75)';
    ctx.beginPath();ctx.arc(sx0+br2,lY-fs*.25,br2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=alive?'rgba(255,255,255,.92)':'rgba(200,150,150,.7)';
    ctx.textAlign='left'; ctx.fillText(nm,sx0+br2*2+gap2,lY); ctx.textAlign='center';
    // Lives
    ctx.font=`${fs*.88}px system-ui`;
    ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.fillText(liveStr,0,iconR+fs*2.05);
    // Score (above icon, same transform)
    ctx.font=`bold ${Math.max(VW*.28,8)}px system-ui`;
    ctx.fillStyle=alive?col+'cc':'rgba(140,60,60,.5)';
    ctx.fillText(scores[s]||0,0,-(iconR+fs*.45));
    ctx.restore();
  });

  // ── Paddles: solid, no gradient, no shadow ────────────────────
  all.forEach(s=>{
    const pad=paddles[s]; if(!pad?.alive)return;
    const col=PCOL[s], isBig=(powerups?.[s]?.type==='big');
    const eLen=gl(isBig?PAD_LEN*BIG_FACTOR:PAD_LEN), pw=gl(PAD_W);
    const dp=(s===mySide)?localPos:pad.pos;
    let rx,ry,rw,rh;
    if(s==='left')  {rx=gx(WALL);          ry=gy(dp); rw=pw;   rh=eLen;}
    if(s==='right') {rx=gx(GW-WALL-PAD_W); ry=gy(dp); rw=pw;   rh=eLen;}
    if(s==='top')   {rx=gx(dp); ry=gy(WALL);           rw=eLen; rh=pw;}
    if(s==='bottom'){rx=gx(dp); ry=gy(GH-WALL-PAD_W);  rw=eLen; rh=pw;}
    ctx.fillStyle=s===mySide?col:col+'c0';
    if(HAS_RR){ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,3*iSc);ctx.fill();}
    else ctx.fillRect(rx,ry,rw,rh);
    if(s===mySide){  // bright rim for own paddle
      ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1.5;
      if(HAS_RR){ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,3*iSc);ctx.stroke();}
      else ctx.strokeRect(rx+.5,ry+.5,rw-1,rh-1);
    }
  });

  // ── Apple ────────────────────────────────────────────────────
  (apples||[]).forEach(ap=>{
    drawApple(gx(ap.x),gy(ap.y),gl(APPLE_R));
    lbl(gx(ap.x),gy(ap.y)+gl(APPLE_R)+7*iSc,'🍎 +1 жизнь','rgba(255,120,80,.8)');
  });

  // ── Ball trail (max 7 dots, no filter() call) ─────────────────
  if(ball){
    const tnow=performance.now();
    trail.push({x:ball.x,y:ball.y,t:tnow});
    if(trail.length>8) trail.shift();
    const tl=trail.length;
    for(let i=0;i<tl-1;i++){
      ctx.fillStyle=`rgba(255,255,255,${(i/tl)*.13})`;
      ctx.beginPath();
      ctx.arc(gx(trail[i].x),gy(trail[i].y),gl(BALL_R)*(i/tl)*.75,0,Math.PI*2);
      ctx.fill();
    }
  }

  // ── Ball ─────────────────────────────────────────────────────
  if(ball){
    const bx=gx(ball.x), by=gy(ball.y), br=gl(BALL_R)*1.3;
    const spd=Math.hypot(ball.vx||0,ball.vy||0);
    const nx=spd>0?(ball.vx||0)/spd:0, ny=spd>0?(ball.vy||0)/spd:0;
    if(ball.frozen){
      ctx.strokeStyle='rgba(136,204,255,.42)'; ctx.lineWidth=1.8*iSc;
      const prog=(ball.freezeTimer||0)/2;
      ctx.beginPath();
      ctx.arc(bx,by,br*1.9,-Math.PI/2,-Math.PI/2+prog*2*Math.PI);
      ctx.stroke();
    }
    cartoonBall(bx,by,br,null,nx,ny,ball.frozen?'frozen':'normal',false);
  }
}

// ─── Draw helpers ─────────────────────────────────────────────────
function lbl(x,y,text,col){
  ctx.fillStyle=col; ctx.font=`600 ${Math.max(6*iSc,6)}px system-ui`;
  ctx.textAlign='center'; ctx.fillText(text,x,y);
}
function drawApple(cx,cy,r){
  ctx.fillStyle='#e84040';
  ctx.beginPath();ctx.arc(cx,cy,r*.9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3db83d';
  ctx.beginPath();
  ctx.moveTo(cx+r*.18,cy-r*.6);ctx.lineTo(cx+r*.52,cy-r*.88);
  ctx.lineTo(cx+r*.56,cy-r*.48);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#6b3a2a';ctx.lineWidth=Math.max(1.4*iSc,1);
  ctx.beginPath();ctx.moveTo(cx,cy-r*.8);ctx.lineTo(cx,cy-r*.38);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.26)';
  ctx.beginPath();ctx.arc(cx-r*.22,cy-r*.24,r*.2,0,Math.PI*2);ctx.fill();
}

// ─── Start lobby animation ────────────────────────────────────────
drawLobbyPreviews();
